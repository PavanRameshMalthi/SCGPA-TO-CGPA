<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CGPA Calculator</title>

  <!-- Google Font -->

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Icons -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- Theme Toggle -->

  <button
    class="theme-toggle"
    id="themeToggle"
  >
    <i class="fa-solid fa-moon"></i>
  </button>

  <div class="container">

    <!-- Header -->

    <div class="header">

      <h1>CGPA Calculator</h1>

      <p>
        Calculate your CGPA and Percentage instantly
      </p>

    </div>

    <!-- Stats -->

    <div class="stats">

      <div class="stat-card">

        <h3 id="semesterCount">0</h3>

        <p>Semesters</p>

      </div>

      <div class="stat-card">

        <h3 id="creditCount">0</h3>

        <p>Total Credits</p>

      </div>

    </div>

    <!-- Semester Cards -->

    <div id="semesters"></div>

    <!-- Empty State -->

    <div
      class="empty-state"
      id="emptyState"
    >

      <i class="fa-solid fa-graduation-cap"></i>

      <p>
        No semesters added yet
      </p>

    </div>

    <!-- Buttons -->

    <div class="buttons">

      <button
        id="addSemesterBtn"
        class="add-btn"
      >

        <i class="fa-solid fa-plus"></i>

        Add Semester

      </button>

      <button
        id="calculateBtn"
        class="calculate-btn"
      >

        <i class="fa-solid fa-calculator"></i>

        Calculate

      </button>

      <button
        id="resetBtn"
        class="reset-btn"
      >

        <i class="fa-solid fa-rotate-right"></i>

        Reset

      </button>

    </div>

    <!-- Result -->

    <div id="result"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
